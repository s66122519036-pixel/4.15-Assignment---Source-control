<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate and plot displacement</title>
    <link rel="stylesheet" href="style.css">
    <!-- นำเข้า Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h2>Calculate and plot displacement</h2>

        <form id="calcForm">
            <p>
                <label for="u">Initial velocity (u):</label>
                <input type="number" id="u" value="0" step="any" required> m/s
            </p>
            <p>
                <label for="a">Acceleration (a):</label>
                <input type="number" id="a" value="1.5" step="any" required> m/s<sup>2</sup>
            </p>
            <p>
                <label for="t">Total time (t):</label>
                <input type="number" id="t" value="10" step="any" required> s
            </p>

            <!-- เพิ่มช่องแสดง Displacement (s) -->
            <p>
                <label for="s">Displacement (s):</label>
                <input type="text" id="s" readonly> m
            </p>

            <!-- เพิ่ม Dropdown เลือกจำนวน Samples -->
            <p>
                <label for="samples">Number of samples:</label>
                <select id="samples">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </p>

            <button type="submit">Calculate</button>
        </form>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
